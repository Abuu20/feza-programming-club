<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <!-- Responsive Meta Tags -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5, user-scalable=yes" />
    <meta name="theme-color" content="#002B5C" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="mobile-web-app-capable" content="yes" />
    
    <!-- SEO Meta Tags -->
    <meta
      name="description"
      content="Feza Programming Club - Learn to code, create, and innovate. Join our community of young programmers in Tanzania."
    />
    <meta name="keywords" content="programming, coding, python, Tanzania, Feza, coding club, learn to code" />
    <meta name="author" content="Feza Programming Club" />
    
    <!-- Open Graph / Social Media -->
    <meta property="og:title" content="Feza Programming Club" />
    <meta property="og:description" content="Learn to code, create, and innovate with Feza Programming Club" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://fezaprogramming.com/" />
    <meta property="og:image" content="%PUBLIC_URL%/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:site_name" content="Feza Programming Club" />
    
    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Feza Programming Club" />
    <meta name="twitter:description" content="Learn to code, create, and innovate" />
    <meta name="twitter:image" content="%PUBLIC_URL%/og-image.jpg" />
    
    <!-- PWA Support -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="%PUBLIC_URL%/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="%PUBLIC_URL%/icon-512.png" />
    <link rel="canonical" href="https://fezaprogramming.com/" />
    
    <title>Feza Programming Club</title>
    
    <!-- Font Optimization -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

    <!-- Structured data: helps Google understand this is an org/club, not just a generic page -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Feza Programming Club",
        "url": "https://fezaprogramming.com/",
        "logo": "https://fezaprogramming.com/icon-512.png",
        "description": "A student programming club at Feza Boys School in Dar es Salaam, Tanzania, teaching young people to code.",
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Dar es Salaam",
          "addressCountry": "TZ"
        },
        "email": "fezaclub@gmail.com"
      }
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
